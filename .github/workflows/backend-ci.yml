name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

jobs:
  test-services:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - cart-service
          - order-service
          - point-service
          - product-service
          - promotion-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/services/${{ matrix.service }}/go.sum

      - name: Install dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: go mod download

      - name: Verify dependencies
        working-directory: backend/services/${{ matrix.service }}
        run: go mod verify

      - name: Run go vet
        working-directory: backend/services/${{ matrix.service }}
        run: go vet ./...

      - name: Run tests
        working-directory: backend/services/${{ matrix.service }}
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: backend/services/${{ matrix.service }}/coverage.out
          flags: ${{ matrix.service }}
          fail_ci_if_error: false

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test-services
    
    strategy:
      matrix:
        service:
          - cart-service
          - order-service
          - point-service
          - product-service
          - promotion-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/services/${{ matrix.service }}/go.sum

      - name: Build service
        working-directory: backend/services/${{ matrix.service }}
        run: |
          go build -v -o bin/main .

  lint:
    name: Lint ${{ matrix.service }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - cart-service
          - order-service
          - point-service
          - product-service
          - promotion-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/services/${{ matrix.service }}/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: backend/services/${{ matrix.service }}
          args: --timeout=5m

  validate-openapi:
    name: Validate OpenAPI Generation
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        service:
          - cart-service
          - order-service
          - point-service
          - product-service
          - promotion-service
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install oapi-codegen
        run: go install github.com/deepmap/oapi-codegen/cmd/oapi-codegen@v1.16.2

      - name: Generate OpenAPI code
        working-directory: backend/services/${{ matrix.service }}
        run: |
          if [ -f "Makefile" ]; then
            make generate
          fi

      - name: Check for changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Generated files are out of sync. Please run 'make generate' in ${{ matrix.service }}"
            git diff
            exit 1
          fi
